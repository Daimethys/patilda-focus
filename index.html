<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Time with Patilda | 50m Focus & 10m Break</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #030712;
      color: #f8fafc;
      user-select: none;
    }

    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Aurora Canvas Background Styling */
    #aurora-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Glassmorphic Panel */
    .glass-card {
      background: rgba(10, 18, 30, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                  0 0 40px rgba(52, 211, 153, 0.08);
    }

    /* Progress Ring Animation Smoothness */
    .progress-ring__circle {
      transition: stroke-dashoffset 0.4s linear, stroke 0.6s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* Cat Animation Details */
    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }
    .cat-tail {
      transform-origin: 30px 65px;
      animation: tailWag 2.6s ease-in-out infinite;
    }

    @keyframes catBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }
    .cat-eyes {
      transform-origin: 52px 36px;
      animation: catBlink 4.2s infinite;
    }

    @keyframes earTwitch {
      0%, 86%, 100% { transform: rotate(0deg); }
      90% { transform: rotate(-6deg); }
      95% { transform: rotate(6deg); }
    }
    .cat-ears {
      transform-origin: 52px 28px;
      animation: earTwitch 5.5s infinite;
    }

    /* Cosmic Fur Pulsing Nebula Glow */
    @keyframes nebulaPulse {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.45)) drop-shadow(0 0 20px rgba(216, 180, 254, 0.25)); }
      50% { filter: drop-shadow(0 0 18px rgba(192, 132, 252, 0.75)) drop-shadow(0 0 28px rgba(147, 51, 234, 0.4)); }
    }
    .galaxy-cat-body {
      animation: nebulaPulse 4s ease-in-out infinite;
    }

    @keyframes breathing {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }
    .cat-breath {
      animation: breathing 3.6s ease-in-out infinite;
      transform-origin: center;
    }

    /* Speech bubble floating animation */
    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .speech-bubble {
      animation: bubbleFloat 2.4s ease-in-out infinite;
    }

    /* Star twinkling */
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }

    /* Pulsing Glow */
    .glow-aura {
      transition: all 0.5s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative selection:bg-emerald-500 selection:text-black">

  <!-- Stars layer -->

    <span id="toast-message">Session completed! Enjoy your break.</span>

      <p class="text-xs sm:text-sm text-slate-300/80 mt-1">50 min focus &bull; 10 min break &bull; with a curious feline companion</p>

    <!-- Circular Timer Card -->

            cy="140"

    <!-- Mode Selector Tabs -->

  <script>
    const FOCUS_SECONDS = 50 * 60;
    const BREAK_SECONDS = 10 * 60;
    const RADIUS = 115;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

    let mode = 'focus';
    let totalDuration = FOCUS_SECONDS;
    let timeLeft = FOCUS_SECONDS;
    let timerId = null;
    let isRunning = false;
    let completedCycles = 0;
    let soundEnabled = true;

    const timeDisplay = document.getElementById('time-display');
    const sessionLabel = document.getElementById('session-label');
    const statusTag = document.getElementById('status-tag');
    const cycleVal = document.getElementById('cycle-val');
    const progressCircle = document.getElementById('progress-circle');
    const catCarrier = document.getElementById('cat-carrier');
    const btnToggle = document.getElementById('btn-toggle');
    const btnIcon = document.getElementById('btn-icon');
    const btnText = document.getElementById('btn-text');
    const btnReset = document.getElementById('btn-reset');
    const btnSkip = document.getElementById('btn-skip');
    const btnSound = document.getElementById('btn-sound');
    const soundIcon = document.getElementById('sound-icon');
    const modeFocusBtn = document.getElementById('mode-focus-btn');
    const modeBreakBtn = document.getElementById('mode-break-btn');
    const ambientGlow = document.getElementById('ambient-glow');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');
    
    // Cat parts for switching
    const focusGlasses = document.getElementById('focus-glasses');
    const catEyesFocus = document.getElementById('cat-eyes-focus');
    const catEyesBreak = document.getElementById('cat-eyes-break');
    const breakTeacup = document.getElementById('break-teacup');
    const bubbleBg = document.getElementById('bubble-bg');
    const bubbleRect = document.getElementById('bubble-rect');
    const bubblePoly = document.getElementById('bubble-poly');
    const bubbleLine = document.getElementById('bubble-line');
    const bubbleText = document.getElementById('bubble-text');

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playChime(isBreakStart) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const notes = isBreakStart ? [523.25, 659.25, 783.99, 1046.50] : [783.99, 659.25, 587.33, 440.00];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.16);
          gain.gain.setValueAtTime(0.001, now + idx * 0.16);
          gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.16 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.16 + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.16);
          osc.stop(now + idx * 0.16 + 1.3);
        });
      } catch (e) {}
    }

    function playClickSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(540, ctx.currentTime);
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.07);
      } catch (e) {}
    }

    function updateCatPosition(progressFraction) {
      const startAngle = -Math.PI / 2;
      const angle = startAngle + (progressFraction * 2 * Math.PI);
      const dialBox = document.querySelector('.relative.w-72');
      const boxSize = dialBox ? dialBox.offsetWidth : 320;
      const scale = boxSize / 280;
      const effectiveRadius = RADIUS * scale;

      const x = Math.cos(angle) * effectiveRadius;
      const y = Math.sin(angle) * effectiveRadius;
      const tangentDeg = (angle * 180 / Math.PI) + 90;
      
      catCarrier.style.transform = `translate(${x}px, ${y}px) rotate(${tangentDeg}deg)`;
    }

    function formatTime(sec) {
      const mins = Math.floor(sec / 60);
      const secs = sec % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function render() {
      timeDisplay.textContent = formatTime(timeLeft);
      document.title = `${formatTime(timeLeft)} - ${mode === 'focus' ? 'Focus' : 'Break'} | Focus Time with Patilda`;

      const progressFraction = (totalDuration - timeLeft) / totalDuration;
      const offset = CIRCUMFERENCE * (1 - progressFraction);
      progressCircle.style.strokeDashoffset = offset;
      updateCatPosition(progressFraction);
    }

    function switchMode(newMode, autoStart = false) {
      mode = newMode;
      clearInterval(timerId);
      isRunning = false;

      if (mode === 'focus') {
        totalDuration = FOCUS_SECONDS;
        timeLeft = FOCUS_SECONDS;
        sessionLabel.textContent = "Deep Focus";
        sessionLabel.className = "text-xs uppercase tracking-widest text-emerald-300 font-semibold mb-1";
        statusTag.textContent = "Focus Mode";
        statusTag.parentElement.className = "inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-card mb-3 border border-emerald-500/30 text-xs tracking-wider uppercase font-semibold text-emerald-300 shadow-sm";
        progressCircle.setAttribute('stroke', 'url(#focusGradient)');
        ambientGlow.className = "absolute w-64 h-64 rounded-full bg-emerald-500/15 blur-3xl -z-10 pointer-events-none";

        // Show glasses, cyan eyes, Do it!
        focusGlasses.classList.remove('hidden');
        catEyesFocus.classList.remove('hidden');
        catEyesBreak.classList.add('hidden');
        breakTeacup.classList.add('hidden');

        bubbleBg.setAttribute('width', '44');
        bubbleRect.setAttribute('width', '44');
        bubblePoly.setAttribute('points', '63,20 60,25 68,19');
        bubbleLine.setAttribute('points', '63,20 60,25 68,19');
        bubbleText.setAttribute('x', '79');
        bubbleText.textContent = "Do it!";

        btnToggle.className = "flex-1 max-w-[170px] py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-gray-950 font-bold flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/25 active:scale-95 transition-all duration-200";
        modeFocusBtn.className = "py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
        modeBreakBtn.className = "py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all bg-white/5 text-slate-400 hover:bg-white/10 border border-transparent";
      } else {
        totalDuration = BREAK_SECONDS;
        timeLeft = BREAK_SECONDS;
        sessionLabel.textContent = "Rest & Recharge";
        sessionLabel.className = "text-xs uppercase tracking-widest text-purple-300 font-semibold mb-1";
        statusTag.textContent = "Rest Interval";
        statusTag.parentElement.className = "inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-card mb-3 border border-purple-500/30 text-xs tracking-wider uppercase font-semibold text-purple-300 shadow-sm";
        progressCircle.setAttribute('stroke', 'url(#breakGradient)');
        ambientGlow.className = "absolute w-64 h-64 rounded-full bg-purple-500/20 blur-3xl -z-10 pointer-events-none";

        // Show teacup, closed eyes, its tea time
        focusGlasses.classList.add('hidden');
        catEyesFocus.classList.add('hidden');
        catEyesBreak.classList.remove('hidden');
        breakTeacup.classList.remove('hidden');

        bubbleBg.setAttribute('width', '76');
        bubbleRect.setAttribute('width', '76');
        bubblePoly.setAttribute('points', '57,19 54,24 62,18');
        bubbleLine.setAttribute('points', '57,19 54,24 62,18');
        bubbleText.setAttribute('x', '73');
        bubbleText.textContent = "its tea time";

        btnToggle.className = "flex-1 max-w-[170px] py-3.5 px-6 rounded-2xl bg-gradient-to-r from-purple-500 to-pink-400 hover:from-purple-400 hover:to-pink-300 text-gray-950 font-bold flex items-center justify-center gap-2 shadow-lg shadow-purple-500/25 active:scale-95 transition-all duration-200";
        modeFocusBtn.className = "py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all bg-white/5 text-slate-400 hover:bg-white/10 border border-transparent";
        modeBreakBtn.className = "py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all bg-purple-500/20 text-purple-300 border border-purple-500/40";
      }

      updatePlayBtnUI();
      render();

      if (autoStart) startTimer();
    }

    function updatePlayBtnUI() {
      if (isRunning) {
        btnIcon.setAttribute('data-lucide', 'pause');
        btnText.textContent = "Pause";
      } else {
        btnIcon.setAttribute('data-lucide', 'play');
        btnText.textContent = timeLeft < totalDuration ? "Resume" : "Start";
      }
      lucide.createIcons();
    }

    function showToast(message) {
      toastMessage.textContent = message;
      toast.classList.remove('-translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-20', 'opacity-0');
      }, 4500);
    }

    function onTimerComplete() {
      clearInterval(timerId);
      isRunning = false;
      completedCycles += 1;
      if (cycleVal) cycleVal.textContent = completedCycles;

      if (mode === 'focus') {
        playChime(true);
        showToast(`✨ Focus cycle #${completedCycles} done! +1 added to cycles.`);
        switchMode('break', true);
      } else {
        playChime(false);
        showToast(`🌟 Break cycle #${completedCycles} finished! +1 added to cycles.`);
        switchMode('focus', false);
      }
    }

    function tick() {
      if (timeLeft > 0) {
        timeLeft--;
        render();
      } else {
        onTimerComplete();
      }
    }

    function startTimer() {
      getAudioContext();
      if (!isRunning) {
        isRunning = true;
        updatePlayBtnUI();
        timerId = setInterval(tick, 1000);
      }
    }

    function pauseTimer() {
      if (isRunning) {
        clearInterval(timerId);
        isRunning = false;
        updatePlayBtnUI();
      }
    }

    function toggleTimer() {
      playClickSound();
      if (isRunning) pauseTimer();
      else startTimer();
    }

    function resetTimer() {
      playClickSound();
      pauseTimer();
      timeLeft = totalDuration;
      render();
      updatePlayBtnUI();
    }

    function skipSession() {
      playClickSound();
      pauseTimer();
      if (mode === 'focus') {
        switchMode('break', false);
        showToast("Switched to Break mode (10 min)");
      } else {
        switchMode('focus', false);
        showToast("Switched to Focus mode (50 min)");
      }
    }

    if (btnToggle) btnToggle.addEventListener('click', toggleTimer);
    if (btnReset) btnReset.addEventListener('click', resetTimer);
    if (btnSkip) btnSkip.addEventListener('click', skipSession);

    if (modeFocusBtn) {
      modeFocusBtn.addEventListener('click', () => {
        if (mode !== 'focus') {
          playClickSound();
          switchMode('focus', false);
        }
      });
    }

    if (modeBreakBtn) {
      modeBreakBtn.addEventListener('click', () => {
        if (mode !== 'break') {
          playClickSound();
          switchMode('break', false);
        }
      });
    }

    if (btnSound) {
      btnSound.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        playClickSound();
        if (soundEnabled) {
          soundIcon.setAttribute('data-lucide', 'volume-2');
          soundIcon.parentElement.classList.remove('text-rose-400');
          showToast("Sound notifications enabled");
        } else {
          soundIcon.setAttribute('data-lucide', 'volume-x');
          soundIcon.parentElement.classList.add('text-rose-400');
          showToast("Sound notifications muted");
        }
        lucide.createIcons();
      });
    }

    window.addEventListener('resize', () => render());

    const canvas = document.getElementById('aurora-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const ribbons = [
      { color1: 'rgba(52, 211, 153, 0.45)', color2: 'rgba(16, 185, 129, 0)', speed: 0.0008, amp: 90, freq: 0.003, yOffset: 0.35, phase: 0 },
      { color1: 'rgba(45, 212, 191, 0.4)', color2: 'rgba(6, 95, 70, 0)', speed: 0.0012, amp: 120, freq: 0.002, yOffset: 0.42, phase: 2 },
      { color1: 'rgba(139, 92, 246, 0.35)', color2: 'rgba(88, 28, 135, 0)', speed: 0.0009, amp: 80, freq: 0.0025, yOffset: 0.48, phase: 4 },
      { color1: 'rgba(99, 102, 241, 0.3)', color2: 'rgba(30, 27, 75, 0)', speed: 0.0007, amp: 110, freq: 0.0018, yOffset: 0.55, phase: 1 },
      { color1: 'rgba(236, 72, 153, 0.25)', color2: 'rgba(131, 24, 67, 0)', speed: 0.0011, amp: 70, freq: 0.0035, yOffset: 0.38, phase: 3 }
    ];

    let auroraTime = 0;

    function drawAurora() {
      auroraTime += 1;
      ctx.clearRect(0, 0, width, height);

      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#020617');
      skyGrad.addColorStop(0.5, '#051329');
      skyGrad.addColorStop(1, '#020617');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = 'screen';

      ribbons.forEach((ribbon) => {
        ctx.beginPath();
        const baseH = height * ribbon.yOffset;
        ctx.moveTo(0, height);
        ctx.lineTo(0, baseH);

        for (let x = 0; x <= width; x += 12) {
          const wave1 = Math.sin(x * ribbon.freq + auroraTime * ribbon.speed * 2 + ribbon.phase) * ribbon.amp;
          const wave2 = Math.cos(x * ribbon.freq * 0.5 - auroraTime * ribbon.speed + ribbon.phase) * (ribbon.amp * 0.6);
          const y = baseH + wave1 + wave2;
          ctx.lineTo(x, y);
        }

        ctx.lineTo(width, height);
        ctx.closePath();

        const grad = ctx.createLinearGradient(0, baseH - ribbon.amp, 0, baseH + ribbon.amp * 2);
        grad.addColorStop(0, ribbon.color1);
        grad.addColorStop(1, ribbon.color2);
        ctx.fillStyle = grad;
        ctx.fill();
      });

      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(drawAurora);
    }

    function createStars() {
      const container = document.getElementById('stars-container');
      const starCount = 65;
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2.2 + 0.8;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 85}%`;
        star.style.animationDelay = `${Math.random() * 5}s`;
        star.style.animationDuration = `${Math.random() * 3 + 2}s`;
        container.appendChild(star);
      }
    }

    window.onload = function() {
      lucide.createIcons();
      createStars();
      render();
      drawAurora();
    };
  </script>
</body>
